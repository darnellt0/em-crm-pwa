<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https://crm.elevatedmovements.com; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>EM CRM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <div class="brand" aria-hidden="true">EM</div>
      <h1>Elevated Movements CRM</h1>
      <p id="status">Connecting securely…</p>
      <div class="spinner" aria-hidden="true"></div>
      <button id="retry" type="button" hidden>Try again</button>
      <noscript>JavaScript is required to open EM CRM.</noscript>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
