name: Build and Verify Icons

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-icons:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pillow
      run: |
        python -m pip install --upgrade pip
        pip install Pillow==11.3.0

    # Icon generation uses locally installed fonts, so regeneration is not
    # byte-for-byte portable between Windows and Linux runners.
    - name: Verify committed icon integrity and dimensions
      run: python tools/verify_icons.py
